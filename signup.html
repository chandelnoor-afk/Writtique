<!DOCTYPE html>
<html>
<head>
    <title>Signup</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            background-color: #40a3e0; /* Turquoise background */
            font-family: "Helvetica Neue", Arial, sans-serif;
            margin: 0;
background: url("{{ url_for('static', filename='b6.jpg') }}") no-repeat center center fixed;
    background-size: cover;
            padding: 0;
   }
.head{
    color:#20B2AA;
    font-size:170px;
}
header{
color:#2E8B57;
}
        .form-container {
            max-width: 600px;
            margin: 80px auto;
            padding: 60px;
            border: 1px solid #eee;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .form-container h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
            color: #111;
        }

        .form-container label {
            display: block;
            margin: 10px 0 5px;
            font-weight: 500;
        }

        .form-container input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .form-container button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #20B2AA; 
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .form-container button:hover {
            background: #2E8B57; 
        }

        .form-container p {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .form-container a {
            color: #20B2AA;
            text-decoration: none;
        }

        .form-container a:hover {
            text-decoration: underline;
        }

        header {
            text-align: center;
            padding: 20px;
            font-family: 'Brush Script MT', cursive;
            font-size: 40px;
            color: #fff;
        }

        footer {
            text-align: center;
            padding: 15px;
            font-size: 14px;
            color: #fff;
        }
    </style>
</head>
<body>

    <header class="head">
        Writtique
    </header>

    <div class="form-container">
        <h2>Create Account</h2>
        <form method="POST">
            <label>Email:</label>
            <input type="email" name="email" required>

            <label>Password:</label>
            <input type="password" name="password" required>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <ul style="list-style: none; padding: 0;">
      {% for category, message in messages %}
        <li style="color: {% if category == 'danger' %}red{% else %}green{% endif %};
                   font-weight: bold; margin: 5px 0;">
          {{ message }}
        </li>
      {% endfor %}
    </ul>
  {% endif %}
{% endwith %}


            <button type="submit">Signup</button>
        </form>
        <p>Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
    </div>

    <footer>
    </footer>
</body>
</html>
